# dsh-team-dev bundle patch: one insert with two rows — the team-dev composition
# (budget guard + bundled skills + team board) and the separate session-changes
# ledger. Applied over the profile root when this bundle is listed. Users may
# override either row's config by id, or remove the bundle line to uninstall.
- insert:
    - id: dsh-team-dev
      name: dsh-team-dev
    - id: dsh-session-changes
      name: dsh-team-dev/session-changes
