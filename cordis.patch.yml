# dsh-team-dev bundle patch: one row that mounts the budget guard and the
# bundled team-dev / team-boot skills. Applied as ONE insert over the profile
# root when this bundle is listed. Users may override the row's config by id
# (`dsh-team-dev`), or remove the bundle line to uninstall.
- insert:
    - id: dsh-team-dev
      name: '@jiecore/dsh-team-dev'
